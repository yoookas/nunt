name: Docker smoke

# Runs the published container contract on a real docker daemon. This is the
# automated substitute for "start it on my machine": it builds the image,
# starts it with host networking, and checks the things that only break inside
# a container (unprivileged user, low port capability, volume layout, health
# check, admin API round trip).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose*.yml"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose*.yml"

permissions:
  contents: read

jobs:
  container:
    name: build and verify the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image and export the release style archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.run_started_at }}
          tags: nunt:ci
          # The same exporter the release uses, so CI exercises the artifact
          # users actually download: `docker load < nunt-<version>-<arch>.tar.gz`.
          outputs: type=docker,dest=/tmp/nunt-ci.tar
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Load the archive like a release download
        run: |
          set -euo pipefail
          test -s /tmp/nunt-ci.tar
          docker load -i /tmp/nunt-ci.tar
          docker image inspect nunt:ci --format 'id={{.Id}} size={{.Size}}'
          docker image inspect nunt:ci --format 'entrypoint={{.Config.Entrypoint}} healthcheck={{.Config.Healthcheck.Test}}'
          test "$(docker image inspect nunt:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "ci"
          test "$(docker image inspect nunt:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"

      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.yml config > /dev/null

      - name: Start the container with host networking
        run: |
          mkdir -p "$PWD/ci-data"
          docker run -d --name nunt --network host \
            -v "$PWD/ci-data:/data" \
            -e TZ=UTC \
            nunt:ci

      - name: Probe the entrypoint in the foreground
        # Runs the image in the foreground so a startup failure is visible even
        # when the detached container dies before writing any log line.
        run: |
          set -x
          docker ps -a
          docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' nunt || true
          mkdir -p "$PWD/ci-probe"
          docker run --rm --network host -v "$PWD/ci-probe:/data" nunt:ci nunt -v || true
          docker run --rm --network host -v "$PWD/ci-probe:/data" nunt:ci id -u || true
          timeout 12 docker run --rm --network host -v "$PWD/ci-probe:/data" nunt:ci nunt -d /data -log-level debug || true

      - name: Dump the log when anything fails
        if: failure()
        run: |
          docker logs nunt || true
          docker ps -a || true
          docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' nunt || true

      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3113/healthz > /dev/null; then
              echo "healthy after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the service did not become healthy"
          docker logs nunt || true
          exit 1

      - name: Verify the container contract
        run: |
          set -euo pipefail

          # the health check declared in the Dockerfile reports healthy
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nunt)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          test "$status" = "healthy"

          # the service itself runs as the unprivileged user that wrote the config
          test "$(docker exec nunt stat -c %u /data/config.json)" = "1000"

          # low ports are reachable through the file capability baked into the image
          docker exec nunt getcap /usr/local/bin/nunt | grep -q cap_net_bind_service

          # the admin interface and its assets are served
          curl -fsS http://127.0.0.1:3113/ | grep -qi nunt
          curl -fsS http://127.0.0.1:3113/ | grep -q 'id="app"'
          asset=$(curl -fsS http://127.0.0.1:3113/ | grep -o '/static/[^"]*\.js' | head -1)
          curl -fsS "http://127.0.0.1:3113${asset}" > /dev/null

          # secrets are stored with restrictive permissions inside the volume
          docker exec nunt stat -c %a /data/secret.key | grep -qx 600
          docker exec nunt stat -c %a /data/config.json | grep -qx 600

          # the generated administrator password is announced once, and it works
          password=$(docker logs nunt 2>&1 | sed -n 's/.*管理员密码 : \([^ ]*\).*/\1/p' | head -n1)
          test -n "$password"
          echo "password captured: ${#password} chars"
          jq -n --arg p "$password" '{password:$p}' > /tmp/login.json
          status=$(curl -sS -o /tmp/session.json -w '%{http_code}' -c /tmp/cookies \
            -H 'Content-Type: application/json' \
            --data @/tmp/login.json http://127.0.0.1:3113/api/v1/auth/login || true)
          echo "login status: $status"
          echo "login body:"; head -c 300 /tmp/session.json; echo
          [ "$status" = "200" ]
          csrf=$(jq -r '.csrf' /tmp/session.json)
          test -n "$csrf"

          # a fresh install must replace the generated password before the
          # console opens; the API refuses everything else until then
          status=$(curl -sS -o /tmp/password.json -w '%{http_code}' -b /tmp/cookies \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            --data "$(jq -n --arg c "$password" --arg n 'ci-Smoke-Password-1' '{current:$c,new:$n}')" \
            http://127.0.0.1:3113/api/v1/auth/password || true)
          echo "password change status: $status"; cat /tmp/password.json; echo
          [ "$status" = "204" ]
          curl -fsSL -b /tmp/cookies http://127.0.0.1:3113/api/v1/auth/session \
            | jq -e '.mustChangePassword == false' > /dev/null

          # every module is registered and the registry is reachable with the session
          # (a plain count was wrong - there are five, and it broke the day a
          # module was removed; naming them survives additions)
          curl -fsSL -b /tmp/cookies http://127.0.0.1:3113/api/v1/modules \
            | jq -e '[.[].name] as $names | ["acme", "ddns", "forward", "waf", "web"] - $names | length == 0' > /dev/null

          # the health check is a subcommand of the service and works from
          # inside the container (no shell, sed or wget involved)
          docker exec nunt nunt healthcheck
          docker exec nunt nunt healthcheck -d /data -timeout 2s

          # the access log directory is created on start and owned by the
          # runtime user, so records survive a container restart
          docker exec nunt sh -c 'test -d /data/logs/access'
          test "$(docker exec nunt stat -c %u /data/logs/access)" = "1000"

          # build metadata is visible in the image, not only in the binary
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' nunt)" = "ci"

      - name: Stop the container
        if: always()
        run: docker rm -f nunt || true

      - name: Start through compose with an environment port override
        run: |
          set -euo pipefail
          NUNT_IMAGE=nunt:ci NUNT_ADMIN_LISTEN=127.0.0.1:13113 docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13113/healthz > /dev/null; then
              echo "compose stack healthy after $attempt attempts"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:13113/healthz > /dev/null

      - name: Verify the compose stack
        run: |
          set -euo pipefail
          docker compose ps
          # the health check must follow NUNT_ADMIN_LISTEN, not the default port
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nunt || echo unknown)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "healthy"
          docker exec nunt nunt healthcheck
          # the data volume is the bind mount from the compose file
          test "$(docker exec nunt stat -c %u /data/config.json)" = "1000"

      - name: Stop the compose stack
        if: always()
        run: docker compose down -v || true

      - name: Clean up the compose data directory
        if: always()
        # The entrypoint chowns the bind mount to PUID (1000), which the runner
        # user cannot traverse, so removing it needs root.
        run: sudo rm -rf "$PWD/data"
