name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l . | tee /dev/stderr)
          [ -z "$unformatted" ]

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race detector
        # The proxy, forwarder and WAF all run concurrent goroutines; a data
        # race here is a security bug, not just a flake.
        run: go test -race ./... -count=1

      - name: Build
        run: go build -trimpath -o /tmp/nunt ./cmd/nunt

  # Frontend (Playwright + axe) job.
  #
  # It is a separate job so the Go jobs above are neither slowed down nor
  # affected by it: Node/pnpm/Chromium are development-only tooling, the Go
  # build and the Docker image still need no Node at all.
  #
  # What it proves: the 12 console pages really work in a browser - they mount,
  # every key interaction still behaves, there are no console errors, no failed
  # requests and no requests leaving the service, and axe reports zero
  # critical/serious/moderate/minor findings in both themes
  # (ui-smoke runs light, ui-baseline runs dark).
  #
  # Local equivalent (Linux/macOS; on Windows build nunt.exe instead):
  #   pnpm install
  #   pnpm exec playwright install --with-deps chromium
  #   go build -o nunt ./cmd/nunt
  #   node scripts/ui-smoke.mjs --exe ./nunt --out artifacts/ui-smoke
  #   node scripts/ui-baseline.mjs --exe ./nunt --out artifacts/ui-baseline --label ci
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dev dependencies (Playwright + axe-core)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the binary
        run: go build -o nunt ./cmd/nunt

      - name: UI smoke (light theme, per page interactions)
        run: node scripts/ui-smoke.mjs --exe ./nunt --out artifacts/ui-smoke

      - name: UI baseline (dark theme, 12 pages + axe)
        run: node scripts/ui-baseline.mjs --exe ./nunt --out artifacts/ui-baseline --label "ci"

      - name: Upload screenshots and reports
        # Always: a failing run is exactly when the screenshots matter.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui
          path: |
            artifacts/ui-smoke
            artifacts/ui-baseline
          if-no-files-found: warn
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependency vulnerability scanning.
  #
  # The scan is deliberately blocking (no continue-on-error): nunt terminates
  # untrusted traffic from the public internet, so a dependency with a known
  # exploitable vulnerability is a release blocker rather than a warning, and a
  # non-blocking job would silently rot. Blocking is affordable here because the
  # dependency set is small and pinned (x/crypto, x/net, coraza, cron) and
  # govulncheck only reports vulnerabilities that are actually reachable from our
  # code, which keeps the false positive rate low. If it ever becomes noisy, fix
  # the finding or pin/exclude it explicitly in the scan invocation - do not make
  # the job advisory.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Scan for reachable vulnerabilities
        # Pinned instead of @latest: the scan is blocking, so its result has to
        # be reproducible. Bump the version deliberately, in its own change.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
