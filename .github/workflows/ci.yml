name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l . | tee /dev/stderr)
          [ -z "$unformatted" ]

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race detector
        # The proxy, forwarder and WAF all run concurrent goroutines; a data
        # race here is a security bug, not just a flake.
        run: go test -race ./... -count=1

      - name: Build
        run: go build -trimpath -o /tmp/nunt ./cmd/nunt

  # Frontend job.
  #
  # The admin interface is a Vue 3 + Arco Design application built with Vite.
  # Its output is committed under internal/webui/assets (so the binary keeps
  # embedding it and a plain "go build" needs no Node), which is why this job
  # also fails when rebuilding changes those files.
  #
  # Local equivalent:
  #   npm ci --prefix frontend
  #   npm run build --prefix frontend   # rewrites internal/webui/assets
  #   go build -o nunt ./cmd/nunt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Build the admin interface
        run: npm run build --prefix frontend

      - name: Runtime smoke of every route (jsdom)
        run: npm run smoke --prefix frontend

      - name: The committed bundle must match the sources
        # The binary embeds internal/webui/assets, so a stale bundle would ship
        # an old interface. Rebuilding must produce the committed files.
        run: |
          if ! git diff --quiet -- internal/webui/assets; then
            echo "::error::internal/webui/assets is stale; run 'make web' and commit the result"
            git status --short internal/webui/assets | head -20
            exit 1
          fi

      - name: Build the binary with the embedded interface
        run: go build -o nunt ./cmd/nunt

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependency vulnerability scanning.
  #
  # The scan is deliberately blocking (no continue-on-error): nunt terminates
  # untrusted traffic from the public internet, so a dependency with a known
  # exploitable vulnerability is a release blocker rather than a warning, and a
  # non-blocking job would silently rot. Blocking is affordable here because the
  # dependency set is small and pinned (x/crypto, x/net, coraza, cron) and
  # govulncheck only reports vulnerabilities that are actually reachable from our
  # code, which keeps the false positive rate low. If it ever becomes noisy, fix
  # the finding or pin/exclude it explicitly in the scan invocation - do not make
  # the job advisory.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Scan for reachable vulnerabilities
        # Pinned instead of @latest: the scan is blocking, so its result has to
        # be reproducible. Bump the version deliberately, in its own change.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
