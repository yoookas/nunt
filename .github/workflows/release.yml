name: Release

# Builds the container images for every supported platform and attaches them to
# the GitHub release. Nothing is pushed to a registry, and nothing is moved
# between jobs as a build artifact: each job uploads its own file straight into
# the release, so a full artifact quota can never break a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create the release up front so the build jobs have somewhere to upload to.
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
          else
            gh release create "$VERSION" --title "nunt $VERSION" --verify-tag \
              --notes "Container image archives for nunt $VERSION. Load one with `docker load < nunt-$VERSION-amd64.tar.gz` and start it with docker compose. Nothing is published to Docker Hub or GHCR."
          fi

  # ---------------------------------------------------------------------------
  # One image per architecture, uploaded straight into the release.
  # ---------------------------------------------------------------------------
  image:
    name: image ${{ matrix.arch }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.run_started_at }}
          outputs: type=docker,dest=/tmp/nunt-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Compress and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          FILE="nunt-${VERSION}-${ARCH}.tar.gz"
          gzip -9 -c "/tmp/nunt-${VERSION}-${ARCH}.tar" > "/tmp/${FILE}"
          sha256sum "/tmp/${FILE}" | sed "s#/tmp/##" > "/tmp/${FILE}.sha256"
          ls -lh "/tmp/${FILE}"
          gh release upload "$VERSION" "/tmp/${FILE}" --clobber

      - name: Upload the checksum of this image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          gh release upload "$VERSION" "/tmp/nunt-${VERSION}-${ARCH}.tar.gz.sha256" --clobber

  # ---------------------------------------------------------------------------
  # A single multi architecture OCI archive for users who prefer one file.
  # ---------------------------------------------------------------------------
  oci:
    name: multi-arch oci
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.run_started_at }}
          outputs: type=oci,dest=/tmp/nunt-${{ needs.prepare.outputs.version }}-oci.tar

      - name: Compress and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          FILE="nunt-${VERSION}-oci.tar.gz"
          gzip -9 -c "/tmp/nunt-${VERSION}-oci.tar" > "/tmp/${FILE}"
          ls -lh "/tmp/${FILE}"
          gh release upload "$VERSION" "/tmp/${FILE}" --clobber

  # ---------------------------------------------------------------------------
  # Collect every checksum into one SHA256SUMS file and finish the notes.
  # ---------------------------------------------------------------------------
  finalize:
    name: checksums and notes
    needs: [prepare, image, oci]
    runs-on: ubuntu-latest
    env:
      # No checkout in this job, so gh has to be told which repository to talk
      # to (it otherwise tries to read it from a git remote).
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the per image checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist && cd dist
          gh release download "$VERSION" --pattern "*.tar.gz.sha256" --clobber
          cat *.tar.gz.sha256 > SHA256SUMS
          # The per image files are only an intermediate step now.
          for f in *.tar.gz.sha256; do
            gh release delete-asset "$VERSION" "$f" --yes || true
          done
          cat SHA256SUMS

      - name: Upload SHA256SUMS and finish the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release upload "$VERSION" dist/SHA256SUMS --clobber
          gh release edit "$VERSION" --notes "Container image archives for nunt $VERSION.

          Load one and start it:

          \`\`\`sh
          docker load < nunt-$VERSION-amd64.tar.gz
          docker compose up -d
          \`\`\`

          amd64, arm64 and armv7 are single architecture docker archives; the -oci
          archive contains all three platforms. Verify the download with
          SHA256SUMS. Nothing is published to Docker Hub or GHCR."
