name: Release

# Builds the container images for every supported platform and attaches them to
# the GitHub release. Nothing is pushed to a registry, and nothing is moved
# between jobs as a build artifact: each job uploads its own file straight into
# the release, so a full artifact quota can never break a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create the release up front so the build jobs have somewhere to upload to.
  # ---------------------------------------------------------------------------
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # The version becomes a docker tag, a file name and the release title,
          # so it has to be a plain vX.Y.Z[-pre] string: "+build" or spaces would
          # fail later in the image jobs, after the release already exists.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$'; then
            echo "::error::version '$VERSION' is not of the form vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi

          # A pre-release must not be presented as the latest stable download.
          # Compared in lower case so v1.0.0-RC1 is recognised as well.
          case "$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')" in
            *-alpha*|*-beta*|*-rc*|*-pre*|*-dev*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "resolved $VERSION (prerelease=$PRERELEASE)"

      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi

          # The notes are built in a file: putting backticks inside a double
          # quoted --notes argument made the shell run `docker load` here.
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          Container image archives for nunt __VERSION__.

          Load one and start it:

          ```sh
          docker load < nunt-__VERSION__-amd64.tar.gz
          docker compose up -d
          ```

          Nothing is published to Docker Hub or GHCR.
          NOTES
          sed -i "s/__VERSION__/${VERSION}/g" "$notes"

          args=(--title "nunt $VERSION" --verify-tag --notes-file "$notes")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
            echo "publishing $VERSION as a pre-release"
          fi
          gh release create "$VERSION" "${args[@]}"

  # ---------------------------------------------------------------------------
  # One image per architecture, uploaded straight into the release.
  # ---------------------------------------------------------------------------
  image:
    name: image ${{ matrix.arch }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.run_started_at }}
          # Without an explicit tag docker load imports the archive as <none>,
          # because the archive itself carries no repository name.
          tags: |
            nunt:${{ needs.prepare.outputs.version }}
            nunt:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/nunt-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Compress and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          FILE="nunt-${VERSION}-${ARCH}.tar.gz"
          gzip -9 -c "/tmp/nunt-${VERSION}-${ARCH}.tar" > "/tmp/${FILE}"
          sha256sum "/tmp/${FILE}" | sed "s#/tmp/##" > "/tmp/${FILE}.sha256"
          ls -lh "/tmp/${FILE}"
          gh release upload "$VERSION" "/tmp/${FILE}" --clobber

      - name: Upload the checksum of this image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          gh release upload "$VERSION" "/tmp/nunt-${VERSION}-${ARCH}.tar.gz.sha256" --clobber

  # ---------------------------------------------------------------------------
  # A single multi architecture OCI archive for users who prefer one file.
  # ---------------------------------------------------------------------------
  oci:
    name: multi-arch oci
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the OCI archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.run_started_at }}
          tags: |
            nunt:${{ needs.prepare.outputs.version }}
          outputs: type=oci,dest=/tmp/nunt-${{ needs.prepare.outputs.version }}-oci.tar
          # Only the OCI layout can carry attestations (the docker exporter used
          # by the per architecture archives cannot). The SBOM lists every
          # package in the image; provenance records how it was built.
          sbom: true
          provenance: mode=max

      - name: Compress and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          FILE="nunt-${VERSION}-oci.tar.gz"
          gzip -9 -c "/tmp/nunt-${VERSION}-oci.tar" > "/tmp/${FILE}"
          ls -lh "/tmp/${FILE}"
          # The finalize job collects every *.tar.gz.sha256 into SHA256SUMS;
          # without this line the OCI archive is the one download with no
          # published checksum.
          sha256sum "/tmp/${FILE}" | sed "s#/tmp/##" > "/tmp/${FILE}.sha256"
          gh release upload "$VERSION" "/tmp/${FILE}" "/tmp/${FILE}.sha256" --clobber

  # ---------------------------------------------------------------------------
  # Collect every checksum into one SHA256SUMS file and finish the notes.
  # ---------------------------------------------------------------------------
  finalize:
    name: checksums and notes
    needs: [prepare, image, oci]
    runs-on: ubuntu-latest
    env:
      # No checkout in this job, so gh has to be told which repository to talk
      # to (it otherwise tries to read it from a git remote).
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the per image checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist && cd dist
          gh release download "$VERSION" --pattern "*.tar.gz.sha256" --clobber
          cat *.tar.gz.sha256 > SHA256SUMS
          # The per image files are only an intermediate step now.
          for f in *.tar.gz.sha256; do
            gh release delete-asset "$VERSION" "$f" --yes || true
          done
          cat SHA256SUMS

      - name: Upload SHA256SUMS and finish the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" dist/SHA256SUMS --clobber

          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          Container image archives for nunt __VERSION__.

          Load one and start it:

          ```sh
          docker load < nunt-__VERSION__-amd64.tar.gz
          docker compose up -d
          ```

          The loaded image is tagged nunt:__VERSION__ (plus nunt:__VERSION__-<arch>),
          so start the stack with:

              NUNT_IMAGE=nunt:__VERSION__ docker compose up -d

          amd64, arm64 and armv7 are single architecture docker archives; the -oci
          archive contains all three platforms but uses the OCI layout, which
          docker load does not read (use ctr or podman for that one). Verify the
          downloads with SHA256SUMS. Nothing is published to Docker Hub or GHCR.
          NOTES
          sed -i "s/__VERSION__/${VERSION}/g" "$notes"

          args=(--notes-file "$notes")
          if [ "$PRERELEASE" = "true" ]; then
            # Keep a re-run from turning a pre-release back into a normal one.
            args+=(--prerelease)
          fi
          gh release edit "$VERSION" "${args[@]}"
