# docker compose for nunt (host networking).
#
# Host networking is the only supported deployment: bridge mode cannot do port
# forwarding, IPv6, or keep real client IPs for the ACLs and access logs, so
# Docker Desktop (macOS / Windows) is not supported.
#
#   docker compose up -d --build
#
# To run a released image instead of building from source:
#   docker load < nunt-v1.0.0-amd64.tar.gz
#   docker compose up -d      # after setting the image name below
services:
  nunt:
    build:
      context: .
      args:
        VERSION: ${NUNT_VERSION:-dev}
    image: ${NUNT_IMAGE:-nunt:dev}
    container_name: nunt
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      # PUID/PGID must match the owner of ./data on the host
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Admin console port. Empty means "keep whatever ./data/config.json says"
      # (16601 on a fresh volume). Override it for one run without touching the
      # config file:
      #   NUNT_ADMIN_LISTEN=:18080 docker compose up -d
      # NUNT_ADMIN_PORT=18080 works the same way when this line is left empty.
      NUNT_ADMIN_LISTEN: "${NUNT_ADMIN_LISTEN:-}"
    volumes:
      - ./data:/data
    # Privileged ports are allowed through the file capability baked into the
    # image; NET_ADMIN is only needed when the service manages interfaces.
    cap_add:
      - NET_BIND_SERVICE
    # The image already declares HEALTHCHECK and it follows the environment
    # variables, so there is nothing to override here.
