# nunt 的 docker compose 配置（host 网络）。
#
# 只支持 host 网络：bridge 模式下端口转发、IPv6、以及访问日志/白名单所需的
# 真实客户端 IP 都拿不到，因此不支持 Docker Desktop（macOS / Windows）。
#
#   docker compose up -d --build
#
# 用已发布的镜像而不是从源码构建：
#   docker load < nunt-v1.0.0-amd64.tar.gz
#   docker compose up -d      # 先把下面的镜像名改成 nunt:v1.0.0
services:
  nunt:
    build:
      context: .
      args:
        VERSION: ${NUNT_VERSION:-dev}
    image: ${NUNT_IMAGE:-nunt:dev}
    container_name: nunt
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      # PUID/PGID 必须与宿主机 ./data 目录的属主一致
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # 管理后台监听地址。留空表示沿用 ./data/config.json 里的值（全新数据卷默认 3113）；
      # 也可以在网页控制台的设置页里直接修改，保存即生效并写回 config.json，镜像的
      # 健康检查会读取这个值。只想临时换端口、不改配置文件时：
      #   NUNT_ADMIN_LISTEN=:18080 docker compose up -d
      # 这一行留空时，NUNT_ADMIN_PORT=18080 效果相同。
      # 一旦用环境变量覆盖，设置页的地址字段会变成只读：想改回由控制台管理，
      # 需要去掉该环境变量并重启。
      NUNT_ADMIN_LISTEN: "${NUNT_ADMIN_LISTEN:-}"
    volumes:
      - ./data:/data
    # 低端口靠镜像里写入的文件能力（setcap）即可绑定；
    # 只有让服务去管理网卡时才需要 NET_ADMIN。
    cap_add:
      - NET_BIND_SERVICE
    # 镜像本身已声明 HEALTHCHECK，且会自动跟随环境变量与配置里的端口，这里无需覆盖。
